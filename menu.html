<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قائمة الطعام والطلب عبر واتساب</title>
<style>
:root{--c:#b4531a;--bg:#faf6f1;--t:#2a2118;--m:#7b6f63}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(rgba(20,10,0,.55),rgba(20,10,0,.7)),var(--hero) center/cover var(--c);color:#fff;padding:54px 18px 46px;text-align:center}
header h1{margin:0 0 8px;font-size:34px;text-shadow:0 2px 8px #0008}
header p{margin:2px 0;opacity:.92}
nav{position:sticky;top:0;background:#fff;display:flex;gap:8px;overflow-x:auto;padding:10px;box-shadow:0 1px 6px #0002;z-index:5}
nav a{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#f0e7dd;color:var(--t);text-decoration:none;font-size:15px}
main{max-width:1100px;margin:0 auto;padding:12px 14px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
h2{margin:22px 0 10px;border-right:5px solid var(--c);padding-right:10px}
.item{background:#fff;border-radius:12px;padding:12px 14px;margin:0;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 1px 3px #0001}
.item img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none}.item .tx{flex:1}.item b{font-size:17px}.item small{display:block;color:var(--m);margin-top:3px}
.price{color:var(--c);font-weight:700;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:36px;height:36px;border:0;border-radius:50%;background:var(--c);color:#fff;font-size:20px;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
#bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;padding:14px;box-shadow:0 -4px 24px #0004;border-radius:18px 18px 0 0;display:none}
#bar .in{max-width:760px;margin:auto;display:grid;gap:8px}
#bar input{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
#send{background:#25d366;color:#fff;border:0;border-radius:10px;padding:14px;font:700 18px "Segoe UI",Tahoma,Arial,sans-serif;cursor:pointer}
footer{text-align:center;color:var(--m);padding:20px;font-size:14px}
</style>
</head>
<body>
<header><h1 id="n"></h1><p id="t"></p><p id="h"></p></header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer id="f"></footer>
<div id="bar"><div class="in">
 <div id="sum"></div>
 <input id="cn" placeholder="الاسم">
 <input id="ca" placeholder="العنوان أو رقم الطاولة">
 <button id="send">إرسال الطلب عبر واتساب</button>
</div></div>
<script src="menu-config.js"></script>
<script>
const S=window.SHOP,cart={};
document.documentElement.style.setProperty('--c',S.color);
document.title=S.name;if(S.hero)document.querySelector("header").style.setProperty("--hero","url("+S.hero+")");
n.textContent=S.name;t.textContent=S.tagline;h.textContent=S.hours;f.textContent=S.address;
S.categories.forEach(c=>{
 nav.insertAdjacentHTML('beforeend',`<a href="#${c.id}">${c.name}</a>`);
 let html=`<h2 id="${c.id}">${c.name}</h2><div class="grid">`;
 S.items.forEach((it,i)=>{ if(it.cat!==c.id)return;
  html+=`<div class="item">${it.img?`<img src="${it.img}" alt="">`:''}<div class="tx"><b>${it.name}</b>${it.desc?`<small>${it.desc}</small>`:''}<div class="price">${it.price} ${S.currency}</div></div>
  <div class="qty"><button onclick="ch(${i},-1)">−</button><span id="q${i}">0</span><button onclick="ch(${i},1)">+</button></div></div>`;});
 menu.insertAdjacentHTML('beforeend',html+'</div>');
});
function ch(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);document.getElementById('q'+i).textContent=cart[i];upd()}
function upd(){
 let tot=0,cnt=0;Object.keys(cart).forEach(i=>{tot+=cart[i]*S.items[i].price;cnt+=cart[i]});
 bar.style.display=cnt?'block':'none';sum.textContent=`${cnt} صنف — الإجمالي ${tot} ${S.currency}`;
}
send.onclick=()=>{
 let lines=[],tot=0;Object.keys(cart).forEach(i=>{if(cart[i]){const it=S.items[i];lines.push(`• ${it.name} × ${cart[i]} = ${cart[i]*it.price}`);tot+=cart[i]*it.price}});
 const msg=`طلب جديد من ${S.name}\n${lines.join('\n')}\nالإجمالي: ${tot} ${S.currency}\nالاسم: ${cn.value||'-'}\nالعنوان/الطاولة: ${ca.value||'-'}`;
 window.open(`https://wa.me/${S.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
};
</script>
</body>
</html>
